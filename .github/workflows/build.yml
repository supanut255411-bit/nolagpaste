name: Build JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # If you uploaded the .zip file instead of the folders, unzip it here
      - name: Unzip source if needed
        run: |
          if [ -z "$(find . -name build.gradle -not -path './.git/*' | head -n 1)" ]; then
            for z in $(find . -name '*.zip' -not -path './.git/*'); do
              echo "Unzipping $z"
              unzip -oq "$z" -d unzipped-source
            done
          fi

      # Finds the folder that contains build.gradle (repo root or any subfolder)
      - name: Locate Gradle project
        id: locate
        run: |
          FILE=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::No build.gradle and no .zip found. The repo only contains these files:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Found Gradle project in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # This mod's build needs JDK 25 (the mod itself targets Java 21)
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ steps.locate.outputs.dir }}

      - name: Build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxel
          path: |
            ${{ steps.locate.outputs.dir }}/build/libs/*.jar
            !${{ steps.locate.outputs.dir }}/build/libs/*-sources.jar

      # Optional: push a tag like v1.0.0 to publish the jar as a GitHub Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate.outputs.dir }}/build/libs/*.jar
            !${{ steps.locate.outputs.dir }}/build/libs/*-sources.jar
